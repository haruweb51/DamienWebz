<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects | Damien.com</title>
<style>/* ===== 1. COLORS & SETTINGS — change the whole theme here ===== */
:root{
  --bg:#030D19; --bg-2:#061321; --panel:#0A1B2D;
  --border:#24445F; --metal:#5D83A7; --highlight:#A9C9E5;
  --text:#E7EFF8; --text-2:#8FA4B9;
  --glow:0 0 24px rgba(93,131,167,.35);
  --font:"Rajdhani","Segoe UI",system-ui,sans-serif;
  --header-h:64px; --max:1180px;
  /* set from script.js (SITE_CONFIG.hero) */
  --banner-image:none; --banner-height:88vh; --banner-position:center center; --overlay:.55;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:var(--header-h)}
body{background:radial-gradient(ellipse at 50% 0,var(--bg-2),var(--bg) 70%) fixed;color:var(--text);font-family:var(--font);font-size:18px;line-height:1.6;overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit}
:focus-visible{outline:2px solid var(--highlight);outline-offset:3px}
#particles{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;user-select:none}
main,.site-header,.site-footer{position:relative;z-index:1}

/* ===== 2. HEADER ===== */
.site-header{position:sticky;top:0;z-index:50;height:var(--header-h);display:flex;align-items:center;gap:24px;padding:0 24px;background:rgba(3,13,25,.72);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;letter-spacing:.12em;font-weight:600}
.logo-slot{width:36px;height:36px;filter:drop-shadow(0 0 6px rgba(93,131,167,.6))}
nav{display:flex;gap:4px;margin-left:auto}
nav a{position:relative;padding:8px 16px;text-decoration:none;letter-spacing:.2em;font-size:.8rem;color:var(--text-2);border:1px solid transparent;transition:.25s}
nav a:hover,nav a[aria-current]{color:var(--text);border-color:var(--border);background:rgba(36,68,95,.25)}
nav a[aria-current]::after{content:"";position:absolute;left:20%;right:20%;bottom:-1px;height:2px;background:var(--highlight);box-shadow:0 0 8px var(--highlight)}
.status{font-size:.7rem;letter-spacing:.2em;color:var(--text-2);display:flex;align-items:center;gap:8px}
.status i{width:7px;height:7px;border-radius:50%;background:var(--highlight);box-shadow:0 0 8px var(--highlight);animation:pulse 2.4s infinite}
.menu-btn{display:none;margin-left:auto;background:none;border:1px solid var(--border);padding:10px;cursor:pointer}
.menu-btn span{display:block;width:20px;height:2px;background:var(--highlight);margin:4px 0}

/* ===== 3. IMAGE SLOTS (with fallback when an image is missing) ===== */
.img-slot{position:relative;overflow:hidden}
.img-slot img{width:100%;height:100%;object-fit:cover;object-position:var(--pos,center)}
.img-slot.missing{background:linear-gradient(135deg,var(--panel),var(--bg-2));border:1px dashed var(--border)}
.img-slot.missing::after{content:"IMAGE";position:absolute;inset:0;display:grid;place-items:center;font-size:.7rem;letter-spacing:.3em;color:var(--metal)}
.logo-slot.missing::after,.hero-emblem.missing::after{content:"D"; font-size:1rem}

/* ===== 4. HERO ===== */
.hero{position:relative;min-height:var(--banner-height);display:grid;place-items:center;text-align:center;overflow:hidden;border-bottom:1px solid var(--border)}
.hero.left{text-align:left;place-items:center start}
.hero-bg{position:absolute;inset:0;background:var(--banner-image) var(--banner-position)/cover no-repeat}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(3,13,25,var(--overlay)),var(--bg))}
.hero-inner{position:relative;max-width:820px;padding:64px 24px}
.hero.left .hero-inner{margin-left:max(24px,calc((100vw - var(--max))/2))}
.hero-emblem{width:128px;height:128px;margin:0 auto 24px;border-radius:50%;filter:drop-shadow(0 0 28px rgba(93,131,167,.55))}
.hero.left .hero-emblem{margin-left:0}
.sys-label{font-size:.75rem;letter-spacing:.4em;color:var(--metal)}
h1{font-size:clamp(2rem,6vw,4rem);letter-spacing:.14em;font-weight:600;line-height:1.1;margin:12px 0;text-shadow:0 0 30px rgba(93,131,167,.4)}
h2{font-size:clamp(.85rem,2vw,1.1rem);letter-spacing:.28em;font-weight:500;color:var(--highlight)}
.hero-inner>p:not(.sys-label){color:var(--text-2);margin:20px auto 32px;max-width:56ch}
.hero.left .hero-inner>p{margin-left:0}
.btn-row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.hero.left .btn-row{justify-content:flex-start}
.btn{display:inline-block;padding:12px 28px;border:1px solid var(--metal);text-decoration:none;font-size:.8rem;letter-spacing:.25em;transition:.25s;background:rgba(10,27,45,.6)}
.btn:hover{background:var(--metal);color:var(--bg);box-shadow:var(--glow)}
.btn.primary{background:linear-gradient(var(--border),var(--panel));border-color:var(--highlight)}

/* ===== 5. SECTIONS, DIVIDER, PANELS ===== */
.wrap{max-width:var(--max);margin:0 auto;padding:72px 24px 8px}
.sys-divider{display:flex;align-items:center;gap:16px;margin-bottom:36px}
.sys-divider::before,.sys-divider::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--border))}
.sys-divider::after{transform:scaleX(-1)}
.sys-divider span{border:1px solid var(--metal);padding:8px 40px;letter-spacing:.35em;font-size:.8rem;background:rgba(10,27,45,.6)}
.no-dividers .sys-divider::before,.no-dividers .sys-divider::after{display:none}
.panel,.card{background:linear-gradient(160deg,rgba(10,27,45,.85),rgba(6,19,33,.85));border:1px solid var(--border);position:relative;overflow:hidden}
.panel::before,.card::before{content:"";position:absolute;top:-1px;left:-1px;width:18px;height:18px;border-top:2px solid var(--metal);border-left:2px solid var(--metal)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.card{display:flex;flex-direction:column;transition:transform .3s,border-color .3s,box-shadow .3s}
.card:hover{transform:translateY(-4px);border-color:var(--metal);box-shadow:var(--glow)}
.card .img-slot{aspect-ratio:16/10;border-bottom:1px solid var(--border)}
.card-body{padding:22px;display:flex;flex-direction:column;gap:10px;flex:1}
.card-label{font-size:.7rem;letter-spacing:.25em;color:var(--metal)}
.card h3{font-size:1.4rem;letter-spacing:.14em;font-weight:600}
.card p{color:var(--text-2);flex:1}
.card .btn{align-self:flex-start;margin-top:8px}
.scan::after,.card:hover::after{content:"";position:absolute;left:0;right:0;height:40px;top:-40px;background:linear-gradient(transparent,rgba(169,201,229,.07),transparent);animation:scan 5s linear infinite;pointer-events:none}
.about{display:grid;grid-template-columns:minmax(200px,320px) 1fr;gap:32px;padding:28px}
.about .img-slot{aspect-ratio:1;border:1px solid var(--border)}
.about h3,.contact h3{letter-spacing:.14em;font-size:1.6rem;margin-bottom:10px}
.about p,.contact p{color:var(--text-2);margin-bottom:12px}
.details{list-style:none;padding:0;display:grid;gap:4px;font-size:.95rem}
.details b{color:var(--metal);letter-spacing:.2em;font-size:.75rem;margin-right:10px}
.contact{padding:36px;text-align:center}
.socials{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.socials a{border:1px solid var(--border);padding:6px 16px;text-decoration:none;font-size:.75rem;letter-spacing:.2em;color:var(--text-2);transition:.25s}
.socials a:hover{border-color:var(--highlight);color:var(--text)}
.site-footer{margin-top:80px;padding:40px 24px;border-top:1px solid var(--border);text-align:center;background:rgba(3,13,25,.7)}
.site-footer .brand{justify-content:center}
.site-footer p{color:var(--text-2);font-size:.85rem;margin-top:10px}
.eot{letter-spacing:.4em;font-size:.65rem!important;color:var(--metal)!important}

/* ===== 6. ANIMATION ===== */
.reveal{opacity:0;transform:translateY(18px);transition:opacity .7s,transform .7s}
.reveal.in{opacity:1;transform:none}
.hero-inner{animation:rise 1s both}
@keyframes rise{from{opacity:0;transform:translateY(20px)}}
@keyframes pulse{50%{opacity:.35}}
@keyframes scan{to{top:100%}}
.no-anim *,.no-anim *::before,.no-anim *::after{animation:none!important;transition:none!important}
.no-anim .reveal{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}

/* ===== 7. RESPONSIVE ===== */
@media (max-width:980px){.cards{grid-template-columns:repeat(2,1fr)}.status{display:none}}
@media (max-width:760px){
  .menu-btn{display:block}
  nav{position:absolute;top:var(--header-h);left:0;right:0;flex-direction:column;background:rgba(3,13,25,.96);border-bottom:1px solid var(--border);display:none;padding:8px}
  nav.open{display:flex}
  .cards,.about{grid-template-columns:1fr}
  .hero{min-height:calc(var(--banner-height) * .85)}
}


.hero.page-hero{min-height:42vh}
/* ===== LIGHTBOX ===== */
.cards.single{grid-template-columns:minmax(0,520px);justify-content:center}
.lb{position:fixed;inset:0;z-index:100;background:rgba(3,13,25,.94);display:flex;align-items:center;justify-content:center;padding:64px 80px}
.lb[hidden]{display:none}
.lb figure{margin:0;text-align:center;max-width:100%}
.lb img{max-width:100%;max-height:68vh;margin:0 auto;border:1px solid var(--metal);box-shadow:var(--glow)}
.lb figcaption{display:grid;gap:8px;justify-items:center;max-width:720px;margin:16px auto 0;color:var(--text-2)}
.lb figcaption strong{letter-spacing:.2em;font-size:1.15rem;color:var(--text)}
.lb-count{font-size:.7rem;letter-spacing:.25em;color:var(--metal)}
.lb-miss{padding:60px 40px;border:1px dashed var(--border);color:var(--metal);letter-spacing:.2em;font-size:.8rem}
.lb-x,.lb-nav{position:absolute;width:44px;height:44px;font-size:1.4rem;line-height:1;background:rgba(10,27,45,.85);border:1px solid var(--metal);color:var(--text);cursor:pointer;transition:.25s}
.lb-x:hover,.lb-nav:hover{background:var(--metal);color:var(--bg)}
.lb-x{top:16px;right:16px}
.lb-nav{top:50%;transform:translateY(-50%)}
.prev{left:16px}.next{right:16px}
@media (max-width:760px){.lb{padding:64px 12px}}
</style>
</head>

/* Fills a container with an image; shows a styled placeholder if it fails to load. */
function setImage(box, src, alt, pos) {
  box.classList.add("img-slot");
  if (pos) box.style.setProperty("--pos", pos);
  if (!src) { box.classList.add("missing"); return; }
  const img = new Image();
  img.alt = alt || ""; img.loading = "lazy";
  img.onerror = () => { img.remove(); box.classList.add("missing"); };
  img.src = src;
  box.appendChild(img);
}

function renderCard(c, extraBtnCls) {
  const card = el("article", "card reveal" + (SITE_CONFIG.scanEffect ? "" : ""));
  if (c.showImage !== false && c.image) {
    const m = el("div"); setImage(m, c.image, c.title, c.imagePosition); card.appendChild(m);
  }
  const b = el("div", "card-body",
    `<span class="card-label">${esc(c.label)}</span><h3>${esc(c.title)}</h3><p>${esc(c.description)}</p>` +
    `<a class="btn" href="${esc(c.href || "#")}">${esc(c.button)}</a>`);
  card.appendChild(b);
  return card;
}

});
function showLb(i) {
  cur = (i + N) % N; const p = P[cur], im = $("#lbImg"), miss = $("#lbMiss");
  miss.hidden = true; im.hidden = false;
  im.onerror = () => { im.hidden = true; miss.hidden = false; miss.textContent = "IMAGE NOT FOUND: " + p.image; };
  if (p.image) im.src = p.image; else im.onerror();
  im.alt = p.title;
  $("#lbCap").innerHTML = `<span class="lb-count">${pad(cur + 1)} / ${pad(N)}  //  ${esc(p.label)}</span><strong>${esc(p.title)}</strong><span>${esc(p.description)}</span>` +
    (p.href && p.href !== "#" ? `<a class="btn" href="${esc(p.href)}" target="_blank" rel="noopener">OPEN PROJECT</a>` : "");
}
function openLb(i) { lastFocus = document.activeElement; $("#lb").hidden = false; document.body.style.overflow = "hidden"; showLb(i); $("#lbClose").focus(); }
function closeLb() { $("#lb").hidden = true; document.body.style.overflow = ""; if (lastFocus) lastFocus.focus(); }
$("#lbClose").onclick = closeLb; $("#lbPrev").onclick = () => showLb(cur - 1); $("#lbNext").onclick = () => showLb(cur + 1);
$("#lb").addEventListener("click", e => { if (e.target.id === "lb") closeLb(); });
document.addEventListener("keydown", e => {
  if ($("#lb").hidden) return;
  if (e.key === "Escape") closeLb();
  else if (e.key === "ArrowLeft") showLb(cur - 1);
  else if (e.key === "ArrowRight") showLb(cur + 1);
  else if (e.key === "Tab") { const f = [...$("#lb").querySelectorAll("button, a[href]")], i = f.indexOf(document.activeElement);
    e.preventDefault(); f[(i + (e.shiftKey ? f.length - 1 : 1)) % f.length].focus(); }
});
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: .12 });
document.querySelectorAll(".reveal").forEach(r => animOn ? io.observe(r) : r.classList.add("in"));
/* Particle background */
function particles() {
  const P = PARTICLE_CONFIG, cv = $("#particles");
  if (!P.enabled || !SITE_CONFIG.showParticles) { cv.remove(); return; }
  const ctx = cv.getContext("2d"); let W, H, pts = [], mouse = { x: -999, y: -999 }, raf, dpr = Math.min(devicePixelRatio || 1, 2);
  const count = () => innerWidth < 768 ? P.mobileCount : P.desktopCount;
  function init() {
    W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    pts = Array.from({ length: count() }, () => ({
      x: Math.random() * W, y: Math.random() * H,
      vx: (Math.random() - .5) * P.particleSpeed * 2, vy: (Math.random() - .5) * P.particleSpeed * 2,
      r: Math.random() * 1.4 + .6, t: Math.random() * 6.28
    }));
  }
  function draw() {
    ctx.clearRect(0, 0, W, H);
    for (const p of pts) {
      p.x += p.vx; p.y += p.vy; p.t += .02;
      if (P.pointerInteraction) { const dx = p.x - mouse.x, dy = p.y - mouse.y, d = Math.hypot(dx, dy); if (d < 120) { p.x += dx / d * .6; p.y += dy / d * .6; } }
      if (p.x < 0) p.x = W; if (p.x > W) p.x = 0; if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
      ctx.fillStyle = `rgba(190,215,240,${P.particleOpacity * (.6 + .4 * Math.sin(p.t))})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
    }
    for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) {
      const d = Math.hypot(pts[i].x - pts[j].x, pts[i].y - pts[j].y);
      if (d < P.connectionDistance) {
        ctx.strokeStyle = `rgba(93,131,167,${P.lineOpacity * (1 - d / P.connectionDistance)})`;
        ctx.beginPath(); ctx.moveTo(pts[i].x, pts[i].y); ctx.lineTo(pts[j].x, pts[j].y); ctx.stroke();
      }
    }
    raf = requestAnimationFrame(draw);
  }
  init();
  if (reduced || !SITE_CONFIG.animations) { draw(); cancelAnimationFrame(raf); return; } // one still frame
  draw();
  addEventListener("resize", init);
  addEventListener("pointermove", e => { mouse.x = e.clientX; mouse.y = e.clientY; });
  document.addEventListener("visibilitychange", () => { cancelAnimationFrame(raf); if (!document.hidden) draw(); });
}


particles();
</script>
